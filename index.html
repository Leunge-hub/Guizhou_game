<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貴州交流回憶</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        #gameCanvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            background-color: ivory;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1200" height="780"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 13 個人名 list[cite: 6]
const NAMES = [
    "",
    "劉康宇\n(Kevson)",
    "朱富業\n(Jan)",
    "許津豪\n(Felix)",
    "黃宛婷\n(Celina)",
    "不要點擊我\n我很貪錢\n我要收肖像費\n李娜(Lina)",
    "職員\n冼志敏小姐\n(Candy)",
    "義工\n周卓然先生\n(Nathan)\n免費勞動力",
    "陳嘉兒\n(Joey)",
    "施偉丞\n(Vincent)",
    "呂學柔\n(Cindy)",
    "吹水唔抹嘴\n瞓覺流口水\n梁權杰\n(Kenny)",
    "沒錯，就是我\n認錯了黃宛婷\n我叫黃葦欣\n(Rachel)",
    "黃愷喬\n(Zita)"
];

// 尺寸定義[cite: 6]
const CARD_W = 130;
const CARD_H = 195;
const CELL_W = 138;
const CELL_H = 195;

// 全域狀態變數[cite: 6]
let card = new Array(26).fill(0);
let card_type = new Array(26).fill(0); // 0 表示相片牌，1 表示人名牌[cite: 6]
let face = new Array(26).fill(0);
let memo = new Array(26).fill(0);

let stage = 1; // 1 代表 Level 1，2 代表 Level 2[cite: 6]
let use_photo_bg = false; // False 表示純色，True 表示大合照背景[cite: 6]
let bg_button_clicked = false; // 控制是否已點擊背景按鈕[cite: 6]

let proc = 0;
let tmr = 0;
let sel1 = 0;
let sel2 = 0;
let player = 0;
let computer = 0;

// 載入圖片資源 (自動相容 JPG / PNG)[cite: 6]
const img = [];
for (let i = 0; i < 14; i++) {
    img[i] = new Image();
    img[i].src = `${i}.png`;
    img[i].onerror = () => { img[i].src = `${i}.jpg`; };
}

const bg_img1 = new Image();
bg_img1.src = 'bg.png';
bg_img1.onerror = () => { bg_img1.src = 'bg.jpg'; };

const bg_img2 = new Image();
bg_img2.src = 'bg2.png';
bg_img2.onerror = () => { bg_img2.src = 'bg2.jpg'; };

const img_back_l2 = new Image();
img_back_l2.src = '0_level2.png';
img_back_l2.onerror = () => { img_back_l2.src = '0_level2.jpg'; };

// 洗牌函數[cite: 6]
function shuffle_card() {
    for (let i = 0; i < 26; i++) {
        card[i] = 1 + (i % 13);
        card_type[i] = i < 13 ? 0 : 1;
        face[i] = 0;
        memo[i] = 0;
    }
    for (let i = 0; i < 100; i++) {
        let r1 = Math.floor(Math.random() * 13);
        let r2 = Math.floor(Math.random() * 13) + 13;
        [card[r1], card[r2]] = [card[r2], card[r1]];
        [card_type[r1], card_type[r2]] = [card_type[r2], card_type[r1]];
    }
}

// 電腦思考邏輯 1[cite: 6]
function com_select1() {
    for (let i = 0; i < 25; i++) {
        for (let j = i + 1; j < 26; j++) {
            if (memo[i] > 0 && memo[i] === memo[j] && face[i] === 0 && face[j] === 0) {
                return i;
            }
        }
    }
    let unopened = [];
    for (let i = 0; i < 26; i++) {
        if (face[i] === 0) unopened.push(i);
    }
    return unopened.length > 0 ? unopened[Math.floor(Math.random() * unopened.length)] : 0;
}

// 電腦思考邏輯 2[cite: 6]
function com_select2(first_card_idx) {
    let target_num = card[first_card_idx];
    for (let i = 0; i < 26; i++) {
        if (i !== first_card_idx && memo[i] === target_num && face[i] === 0) {
            return i;
        }
    }
    let unopened = [];
    for (let i = 0; i < 26; i++) {
        if (face[i] === 0 && i !== first_card_idx) unopened.push(i);
    }
    return unopened.length > 0 ? unopened[Math.floor(Math.random() * unopened.length)] : first_card_idx;
}

// 繪製卡牌與背景[cite: 6]
function draw_card() {
    ctx.clearRect(0, 0, 1200, 780);

    // 1. 根據設定繪製背景[cite: 6]
    if (use_photo_bg) {
        let current_bg = stage === 1 ? bg_img1 : bg_img2;
        if (current_bg.complete && current_bg.naturalWidth !== 0) {
            ctx.drawImage(current_bg, 0, 0, 1200, 780);
        }
    }

    // 2. 繪製卡牌[cite: 6]
    if (proc !== 0) {
        for (let i = 0; i < 26; i++) {
            if (face[i] === 2) continue; // 配對成功消除[cite: 6]

            let x = (i % 7) * CELL_W + CELL_W / 2;
            let y = Math.floor(i / 7) * CELL_H + CELL_H / 2;

            if (face[i] === 0) {
                // 蓋牌[cite: 6]
                let backImg = (stage === 2 && img_back_l2.complete && img_back_l2.naturalWidth !== 0) ? img_back_l2 : img[0];
                if (backImg.complete) {
                    ctx.drawImage(backImg, x - CARD_W / 2, y - CARD_H / 2, CARD_W, CARD_H);
                }
            } else if (face[i] === 1) {
                // 翻開[cite: 6]
                if (card_type[i] === 0) {
                    if (img[card[i]].complete) {
                        ctx.drawImage(img[card[i]], x - CARD_W / 2, y - CARD_H / 2, CARD_W, CARD_H);
                    }
                } else {
                    // 顯示白色背景 + 居中姓名[cite: 6]
                    ctx.fillStyle = "ivory";
                    ctx.strokeStyle = "gold";
                    ctx.lineWidth = 3;
                    ctx.fillRect(x - CARD_W / 2, y - CARD_H / 2, CARD_W, CARD_H);
                    ctx.strokeRect(x - CARD_W / 2, y - CARD_H / 2, CARD_W, CARD_H);

                    ctx.fillStyle = "black";
                    ctx.font = "bold 18px 'Microsoft JhengHei'";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    let lines = NAMES[card[i]].split('\n');
                    let lineHeight = 22;
                    let startY = y - ((lines.length - 1) * lineHeight) / 2;
                    lines.forEach((line, index) => {
                        ctx.fillText(line, x, startY + index * lineHeight);
                    });
                }
            }
        }
    }
}

// 點擊事件處理[cite: 6]
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const ex = (e.clientX - rect.left) * scaleX;
    const ey = (e.clientY - rect.top) * scaleY;

    // 測試按鈕區域[cite: 6]
    if (proc >= 1 && proc <= 6 && ex > 1000 && ey < 200) {
        player = 26; computer = 0; proc = 7; tmr = 0; return;
    }
    if (proc >= 1 && proc <= 6 && ex > 1000 && ey >= 400 && ey <= 600) {
        player = 0; computer = 26; proc = 7; tmr = 0; return;
    }

    // 開局點擊[cite: 6]
    if (proc === 0) {
        if (ex >= 300 && ex <= 900 && ey >= 270 && ey <= 370) {
            use_photo_bg = !use_photo_bg;
            bg_button_clicked = true;
            return;
        }
        if (bg_button_clicked) {
            if (ex >= 250 && ex <= 550 && ey >= 420 && ey <= 520) {
                stage = 1; shuffle_card(); player = 0; computer = 0; proc = 1; tmr = 0; return;
            }
            if (ex >= 650 && ex <= 950 && ey >= 420 && ey <= 520) {
                stage = 2; shuffle_card(); player = 0; computer = 0; proc = 1; tmr = 0; return;
            }
        }
    }

    // 玩家翻牌邏輯[cite: 6]
    if (proc === 1 || proc === 2) {
        let x = Math.floor(ex / CELL_W);
        let y = Math.floor(ey / CELL_H);
        if (x >= 0 && x <= 6 && y >= 0 && y <= 3) {
            let n = x + y * 7;
            if (n < 26 && face[n] === 0) {
                if (proc === 1) {
                    face[n] = 1; sel1 = n; proc = 2;
                } else if (proc === 2) {
                    face[n] = 1; sel2 = n; proc = 3; tmr = 0;
                }
            }
        }
    }

    // 結算畫面點擊處理[cite: 6]
    if (proc === 7) {
        let msg = "";
        if (player > computer) {
            msg = stage === 1 ? "✨ 太棒了！先下一城！😎\n不過第一關只是熱身，電腦在第二關會火力全開的！🔥\n敢不敢繼續挑戰 Level 2，證明你們的友誼很牢固？😈" : "🎉恭喜你，打敗了電腦！🤩\n證明你們的友誼穩如泰山！😎\n看來貴州交流的回憶還深刻😘";
        } else {
            msg = stage === 1 ? "😒慘慘！在貴州的回憶也太薄弱了吧？\n你們的友誼陷入危機😱，請重新回憶🙂，\n然後再次挑戰，證明你們的友誼非常牢固！加油😊" : "🥺 差一點點就通關了！Level 2 的電腦確實有點厲害！\n別灰心，能來到 Level 2 已經很棒了！👍\n再挑戰一次，這次一定能戰勝電腦！加油！🔥";
        }

        let finish_typing_tmr = 5 + msg.length * 2;
        let show_button_tmr = finish_typing_tmr + 40;

        if (tmr < show_button_tmr) return;

        if (stage === 1 && player > computer) stage = 2;
        else if (stage === 1 && player <= computer) stage = 1;
        else if (stage === 2 && player > computer) stage = 1;
        else if (stage === 2 && player <= computer) stage = 2;

        shuffle_card(); player = 0; computer = 0; proc = 1; tmr = 0;
    }
});

// 主程式迴圈[cite: 6]
function main() {
    tmr++;
    draw_card();

    let stay_time = stage === 1 ? 40 : 20;

    // 開局提示與按鈕繪製 (proc == 0)[cite: 6]
    if (proc === 0) {
        ctx.fillStyle = "ivory"; ctx.strokeStyle = "gold"; ctx.lineWidth = 5;
        ctx.fillRect(300, 270, 600, 100); ctx.strokeRect(300, 270, 600, 100);
        ctx.fillStyle = "black"; ctx.font = "bold 26px 'Microsoft JhengHei'";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("Click to change background", 600, 320);

        if (bg_button_clicked) {
            ctx.fillStyle = "ivory"; ctx.strokeStyle = "gold"; ctx.lineWidth = 5;
            ctx.fillRect(250, 420, 300, 100); ctx.strokeRect(250, 420, 300, 100);
            ctx.fillStyle = "deepskyblue"; ctx.font = "bold 40px 'Times New Roman'";
            ctx.fillText("Level 1", 400, 470);

            // 中間閃爍 "or" 文字 (原封不動保留 %20<10 邏輯)[cite: 6]
            if (tmr % 20 < 10) {
                ctx.fillStyle = "ivory"; ctx.strokeStyle = "gold"; ctx.lineWidth = 5;
                ctx.fillRect(550, 420, 110, 100); ctx.strokeRect(550, 420, 110, 100);
                ctx.fillStyle = "crimson"; ctx.font = "bold 36px 'Microsoft JhengHei'";
                ctx.fillText("or", 605, 470);
            }

            ctx.fillStyle = "ivory"; ctx.strokeStyle = "gold"; ctx.lineWidth = 5;
            ctx.fillRect(650, 420, 300, 100); ctx.strokeRect(650, 420, 300, 100);
            ctx.fillStyle = "crimson"; ctx.font = "bold 40px 'Times New Roman'";
            ctx.fillText("Level 2", 800, 470);
        }
    }

    // 右側 Player 得分資訊欄[cite: 6]
    if (proc >= 1 && proc <= 3) {
        ctx.fillStyle = "skyblue"; ctx.strokeStyle = "gold"; ctx.lineWidth = 5;
    } else {
        ctx.fillStyle = "ivory"; ctx.strokeStyle = "silver"; ctx.lineWidth = 3;
    }
    ctx.fillRect(1030, 30, 140, 160); ctx.strokeRect(1030, 30, 140, 160);
    ctx.fillStyle = "black"; ctx.font = "46px 'Times New Roman'";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("player", 1100, 75); ctx.fillText(player, 1100, 145);

    // 右側 COM 得分資訊欄[cite: 6]
    if (proc >= 4 && proc <= 6) {
        ctx.fillStyle = "pink"; ctx.strokeStyle = "gold"; ctx.lineWidth = 5;
    } else {
        ctx.fillStyle = "ivory"; ctx.strokeStyle = "silver"; ctx.lineWidth = 3;
    }
    ctx.fillRect(1030, 420, 140, 160); ctx.strokeRect(1030, 420, 140, 160);
    ctx.fillStyle = "black"; ctx.font = "46px 'Times New Roman'";
    ctx.fillText("COM", 1100, 465); ctx.fillText(computer, 1100, 535);

    // 玩家比對邏輯 (proc == 3)[cite: 6]
    if (proc === 3 && tmr === stay_time) {
        if (card[sel1] === card[sel2]) {
            face[sel1] = 2; face[sel2] = 2; player += 2;
            memo[sel1] = -1; memo[sel2] = -1;
            if (player + computer === 26) { proc = 7; tmr = 0; }
            else { proc = 1; tmr = 0; }
        } else {
            face[sel1] = 0; face[sel2] = 0;
            if (stage === 1) { memo[sel1] = card[sel1]; } 
            else { memo[sel1] = card[sel1]; memo[sel2] = card[sel2]; }
            proc = 4; tmr = 0;
        }
    }

    // 電腦思考與翻牌 (proc == 4, 5, 6)[cite: 6]
    if (proc === 4 && tmr === 5) {
        sel1 = com_select1(); face[sel1] = 1; proc = 5; tmr = 0;
    }
    if (proc === 5 && tmr === 5) {
        sel2 = com_select2(sel1); face[sel2] = 1; proc = 6; tmr = 0;
    }
    if (proc === 6 && tmr === stay_time) {
        if (card[sel1] === card[sel2]) {
            face[sel1] = 2; face[sel2] = 2; computer += 2;
            memo[sel1] = -1; memo[sel2] = -1;
            if (player + computer === 26) { proc = 7; tmr = 0; }
            else { proc = 4; tmr = 0; }
        } else {
            face[sel1] = 0; face[sel2] = 0;
            if (stage === 1) { memo[sel2] = card[sel2]; } 
            else { memo[sel1] = card[sel1]; memo[sel2] = card[sel2]; }
            proc = 1; tmr = 0;
        }
    }

    // 結算語錄動畫 (proc == 7)[cite: 6]
    if (proc === 7) {
        let target_x = 600, start_x = 1300;
        let slide_progress = Math.min(1.0, tmr / 10.0);
        let current_x = start_x - (start_x - target_x) * slide_progress;

        let full_msg = "";
        let box_fill = "", text_color = "";

        if (player > computer) {
            full_msg = stage === 1 ? "✨ 太棒了！先下一城！😎\n不過第一關只是熱身，電腦在第二關會火力全開的！🔥\n敢不敢繼續挑戰 Level 2，證明你們的友誼很牢固？😈" : "🎉恭喜你，打敗了電腦！🤩\n證明你們的友誼穩如泰山！😎\n看來貴州交流的回憶還深刻😘";
            box_fill = "navy"; text_color = "Cyan";
        } else {
            full_msg = stage === 1 ? "😒慘慘！在貴州的回憶也太薄弱了吧？\n你們的友誼陷入危機😱，請重新回憶🙂，\n然後再次挑戰，證明你們的友誼非常牢固！加油😊" : "🥺 差一點點就通關了！Level 2 的電腦確實有點厲害！\n別灰心，能來到 Level 2 已經很棒了！👍\n再挑戰一次，這次一定能戰勝電腦！加油！🔥";
            box_fill = "maroon"; text_color = "gold";
        }

        let char_count = Math.max(1, Math.floor((tmr - 5) / 2));
        let current_msg = full_msg.slice(0, char_count);

        let finish_typing_tmr = 5 + full_msg.length * 2;
        let show_button_tmr = finish_typing_tmr + 40;

        if (tmr <= show_button_tmr) {
            ctx.fillStyle = box_fill;
            ctx.strokeStyle = box_fill === "navy" ? "gold" : "red";
            ctx.lineWidth = 4;
            ctx.fillRect(current_x - 550, 270, 1100, 240);
            ctx.strokeRect(current_x - 550, 270, 1100, 240);

            ctx.fillStyle = text_color;
            ctx.font = "bold 32px 'Microsoft JhengHei'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            let lines = current_msg.split('\n');
            let lineHeight = 40;
            let startY = 390 - ((lines.length - 1) * lineHeight) / 2;
            lines.forEach((line, index) => {
                ctx.fillText(line, current_x, startY + index * lineHeight);
            });
        }

        if (tmr >= show_button_tmr && (tmr % 20 < 12)) {
            ctx.fillStyle = "ivory"; ctx.strokeStyle = "gold"; ctx.lineWidth = 5;
            ctx.fillRect(820, 630, 360, 80); ctx.strokeRect(820, 630, 360, 80);

            let next_text = stage === 1 ? 
                (player > computer ? "Click to Level 2" : "Click to Restart") :
                (player > computer ? "Click to Restart" : "Retry Level 2");

            ctx.fillStyle = "black"; ctx.font = "bold 30px 'Times New Roman'";
            ctx.fillText(next_text, 1000, 670);
        }
    }

    setTimeout(main, 50);
}

main();
</script>
</body>
</html>
